<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>faugei - Fresh Flowers & Plants</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .newsletter-bg {
            background-image: url('./B12A02-Responsive-Flowers/assets/news-letter-bg.png');
            background-size: cover;
            background-position: center;
        }
    </style>

</head>
<body class="font-sans">
    <!-- Navbar -->
    <nav class="bg-white shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <!-- Logo -->
                <div class="flex items-center">
                    <img src="./B12A02-Responsive-Flowers/assets/logo.png" alt="faugei" class="h-10 w-auto">
                </div>
                
                <!-- Desktop Menu -->
                <div class="hidden md:flex items-center space-x-8">
                    <a href="#" class="text-gray-700 hover:text-orange-500 transition-colors">Home</a>
                    <a href="#" class="text-gray-700 hover:text-orange-500 transition-colors">Shop</a>
                    <a href="#" class="text-gray-700 hover:text-orange-500 transition-colors">About us</a>
                    <div class="flex items-center space-x-2 text-gray-700">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4m0 0L7 13m0 0l-1.5 6H19M7 13v6a1 1 0 001 1h10a1 1 0 001-1v-6M9 21v-2a1 1 0 011-1h2a1 1 0 011 1v2"></path>
                        </svg>
                        <span>Cart ($56)</span>
                    </div>
                </div>
                
                <!-- Mobile Menu -->
                <div class="md:hidden flex items-center space-x-4">
                    <div class="flex items-center space-x-2 text-gray-700">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4m0 0L7 13m0 0l-1.5 6H19M7 13v6a1 1 0 001 1h10a1 1 0 001-1v-6M9 21v-2a1 1 0 011-1h2a1 1 0 011 1v2"></path>
                        </svg>
                        <span>Cart</span>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Banner Section -->
    <section class="bg-gray-50 py-12 lg:py-20">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 items-center">
                <!-- Content - Order 2 on mobile, 1 on desktop -->
                <div class="order-2 lg:order-1 text-center lg:text-left">
                    <h1 class="text-4xl lg:text-6xl font-bold text-gray-900 mb-6">
                        ALWAYS <span class="text-orange-500">FRESH</span><br>
                        <span class="text-orange-500">FLOWERS</span>
                    </h1>
                    <p class="text-gray-600 text-lg mb-8 max-w-md">
                        Indulge your senses with the beauty and fragrance of our fresh flower shop. From classic roses to exotic blooms, we offer a wide variety of fresh flowers that are perfect for any occasion.
                    </p>
                </div>
                
                <!-- Image - Order 1 on mobile, 2 on desktop -->
                <div class="order-1 lg:order-2 flex justify-center">
                    <img src="./B12A02-Responsive-Flowers/assets/hero-flower.png" alt="Fresh Flowers" class="w-full max-w-md lg:max-w-lg">
                </div>
            </div>
        </div>
    </section>
